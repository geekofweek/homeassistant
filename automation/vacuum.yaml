      to: 'on'
      for:
        hours: 48
        minutes: 0
        seconds: 0

  conditions:
    - condition: state
      entity_id: input_boolean.garage_vacuum_weather_hold
      state: 'on'

  actions:
    - action: homeassistant.turn_off
      data: {}
      target:
        entity_id:
          - input_boolean.garage_vacuum_weather_hold

