        ##########################################################

- alias: Vacuum - Set Initial Weather Hold for Garage Vacuum
  id: 'vacuum_set_initial_weather_hold_for_garage_vacuum'

  triggers:
    - trigger: state
      entity_id:
        - weather.REDACTED
      to:
        - lightning
        - lightning-rainy
        - hail
        - pouring
        - rainy
        - snowy
        - snowy-rainy
        - exceptional

  conditions:
    - condition: state
      entity_id: input_boolean.garage_vacuum_weather_hold
      state: 'off'
    - condition: state
      entity_id: input_boolean.garage_vacuum_initial_weather_hold
      state: 'off'
    - condition: or
      conditions:
        - condition: state
          entity_id: person.USER1
          state:
            - not_home
        - condition: state
          entity_id: person.USER2
          state:
            - not_home
        - condition: state
          entity_id: group.household
          state:
            - not_home

  actions:
    - action: homeassistant.turn_on
      data: {}
      target:
        entity_id:
          - input_boolean.garage_vacuum_initial_weather_hold

        ##########################################################
        ## Set Weather Hold for Garage Vacuum
        ##########################################################

- alias: Vacuum - Set Weather Hold for Garage Vacuum
  id: 'vacuum_set_weather_hold_for_garage_vacuum'

  mode: single
  triggers:
    - trigger: state
      entity_id: cover.garage_door
      to: 'open'
      for:
        hours: 0
        minutes: 0
        seconds: 15
    - trigger: state
      entity_id: cover.garage_door
      to: 'opening'
      for:
        hours: 0
        minutes: 0
        seconds: 0
    - trigger: state
      entity_id: group.household
      from: 'not_home'
      to: 'home'
      for:
        hours: 0
        minutes: 0
        seconds: 5
    - trigger: state
      entity_id: person.USER1
      from: 'not_home'
      to: 'home'
      for:
        hours: 0
        minutes: 0
        seconds: 5
    - trigger: state
      entity_id: person.USER2
      from: 'not_home'
      to: 'home'
      for:
        hours: 0
        minutes: 0
        seconds: 5

  conditions:
    - condition: state
      entity_id: input_boolean.garage_vacuum_initial_weather_hold
      state: 'on'

  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.garage_vacuum_weather_hold
              state:
                - "off"
          sequence:
            - action: homeassistant.turn_on
              metadata: {}
              target:
                entity_id: input_boolean.garage_vacuum_weather_hold
              data: {}
        - conditions:
            - condition: state
              entity_id: input_boolean.garage_vacuum_weather_hold
              state:
                - "on"
          sequence:
            - action: homeassistant.turn_off
              metadata: {}
              target:
                entity_id: input_boolean.garage_vacuum_weather_hold
              data: {}
            - delay:
                hours: 0
                minutes: 0
                seconds: 30
                milliseconds: 0
            - action: homeassistant.turn_on
              metadata: {}
              target:
                entity_id: input_boolean.garage_vacuum_weather_hold
              data: {}

