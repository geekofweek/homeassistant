      for:
        hours: 0
        minutes: 0
        seconds: 10

  conditions:
    - condition: state
      entity_id: input_boolean.disable_vacuum_automations
      state: 'off'
    - condition: state
      entity_id: binary_sensor.main_floor_cleaning
      state: 'on'

  actions:
    - action: vacuum.return_to_base
      data: {}
      target:
        entity_id: 
          - vacuum.main_floor

